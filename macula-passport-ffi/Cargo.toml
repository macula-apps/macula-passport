[package]
name = "macula-passport-ffi"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Macula <raf.lefever@erlef.org>"]
description = "UniFFI mobile (Kotlin/Swift) bindings for macula-passport. Wraps it; adds no domain logic of its own."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/macula-apps/macula-passport"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

[lib]
name = "macula_passport_ffi"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
macula-passport = { path = ".." }
macula-rust-sdk = { git = "https://github.com/macula-io/macula-rust-sdk", branch = "master" }
uuid = { version = "1", features = ["v7"] }
uniffi = { version = "0.32", features = ["cli"] }
thiserror = "2"
