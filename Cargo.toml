[workspace]
members = ["macula-passport-ffi"]

[package]
name = "macula-passport"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Macula <raf.lefever@erlef.org>"]
description = "Holder-owned identity/biometric/health dossier, event-sourced on-device."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/macula-apps/macula-passport"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v7"] }
macula-rust = "0.9"
